<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#130c28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mrs. English">
  <title>Mrs. English Ver.3</title>
  <link rel="preload" as="image" href="./assets/photos/top_original.jpg" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/title/title_logo.png" fetchpriority="high">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./src/style.css">
  <style>
    #loading-ui{position:fixed;inset:0;z-index:1200;display:grid;place-items:center;pointer-events:none;color:white;font:14px/1.5 system-ui,sans-serif}
    #loading-ui[hidden]{display:none}#loading-ui .loading-content{text-align:center;max-width:90vw}
    .loading-mark{position:relative;width:112px;height:112px;margin:auto}
    .loading-ring{position:absolute;inset:0;border:2px solid #ffffff26;border-top-color:#fff;border-right-color:#ffffffb3;border-radius:50%;box-shadow:0 0 8px #ffffff24;animation:loading-spin 1s linear infinite}
    #loading-logo{position:absolute;width:68%;height:68%;left:16%;top:16%;object-fit:contain}
    #loading-ui p{max-width:360px;margin:12px auto;text-shadow:0 1px 4px #000}
    #loading-retry{min-height:44px;padding:8px 20px;border:1px solid #ffffffb3;border-radius:5px;background:#160f34;color:white;font:inherit;pointer-events:auto}
    #loading-ui[data-state=error] .loading-ring{animation:none;border-color:#ffffff66}
    @keyframes loading-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.loading-ring{animation:none;border-top-color:#fff}}
  </style>
</head>
<body>
  <img id="scene-background" alt="" aria-hidden="true" hidden>
  <main id="safe-area" aria-label="Mrs. English Ver.3"><div id="stage"></div></main>
  <p id="rotate-notice" role="status">iPhoneを横向きにしてください</p>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <div id="loading-ui" role="status" aria-live="polite" aria-label="読み込み中" hidden><div class="loading-content"><div class="loading-mark"><span class="loading-ring" aria-hidden="true"></span><img id="loading-logo" alt="" hidden></div><p id="loading-error" hidden></p><button id="loading-retry" type="button" hidden>再試行</button></div></div>
  <script>
  (()=>{
    const root=document.getElementById('loading-ui'),error=document.getElementById('loading-error'),retry=document.getElementById('loading-retry');
    const logo=/* LOADING_LOGO */ null;
    if(logo){const image=document.getElementById('loading-logo');image.src=logo;image.hidden=false;}
    const active=new Set();let timer,bootTimer,number=0;
    function emit(){window.dispatchEvent(new Event('mrs-loading-change'));}
    function begin(){const id=++number;active.add(id);root.dataset.state='waiting';root.setAttribute('aria-label','読み込み中');error.hidden=retry.hidden=true;document.getElementById('safe-area').setAttribute('aria-busy','true');if(!timer)timer=setTimeout(()=>{timer=null;if(active.size)root.hidden=false;},250);emit();return id;}
    function end(id){active.delete(id);if(!active.size){clearTimeout(timer);timer=null;if(root.dataset.state!=='error')root.hidden=true;document.getElementById('safe-area').setAttribute('aria-busy','false');}emit();}
    function fail(reason,again=()=>location.reload()) {active.clear();clearTimeout(timer);timer=null;root.dataset.state='error';root.hidden=false;root.setAttribute('aria-label','読み込みエラー');error.textContent=reason?.message||'読み込めませんでした。接続を確認して再試行してください。';error.hidden=retry.hidden=false;retry.onclick=again;document.getElementById('safe-area').setAttribute('aria-busy','false');emit();}
    const boot=begin();bootTimer=setTimeout(()=>fail(new Error('読み込みが完了しませんでした。接続を確認して再試行してください。')),30000);
    window.mrsLoading={get busy(){return active.size>0;},begin,end,fail,finishBoot(){clearTimeout(bootTimer);end(boot);},async run(task,again=task){const id=begin();let deadline;try{return await Promise.race([Promise.resolve().then(task),new Promise((_,reject)=>deadline=setTimeout(()=>reject(new Error('読み込みに時間がかかっています。接続を確認して再試行してください。')),45000))]);}catch(reason){fail(reason,again);throw reason;}finally{clearTimeout(deadline);end(id);}}};
    window.addEventListener('error',event=>{if(event.target?.id==='app-module')fail(new Error('アプリを読み込めませんでした。接続を確認して再試行してください。'));},true);
  })();
  </script>
  <script id="app-module" type="module" src="./src/app.js"></script>
</body>
</html>
