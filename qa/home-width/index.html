<!doctype html><html lang="ja"><meta charset="utf-8"><title>ホーム上下UIの幅調整</title><style>body{font:16px system-ui;background:#14111f;color:#eee;margin:24px}img{width:100%;display:block}figure{margin:0 0 24px}figcaption{margin-bottom:6px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><h1>ホーム上下UIの幅調整</h1><p>セーフエリア全幅へ上下バーを配置。ボタン背景のみ納品素材の9-sliceを使用し、文字・アイコンの寸法とボタンの高さを維持しています。</p><p>844×390の安全領域幅に対する占有率：上部89.5%→100%、下部92.2%→100%。左右の安全領域は維持します。</p><p>SuperStarの参考画像は未添付のため直接比較は未実施です。Chromiumでのセーフエリア模擬検証であり、iPhone実機検証ではありません。</p><h2>844×390：左右47px、下21pxの安全領域</h2><div class="pair"><figure><figcaption>調整前</figcaption><img src="844x390-before.png"></figure><figure><figcaption>調整後</figcaption><img src="844x390.png"></figure></div><h2>他の横画面サイズ</h2><figure><figcaption>852x393</figcaption><img src="852x393.png"></figure><figure><figcaption>932x430</figcaption><img src="932x430.png"></figure><figure><figcaption>812x375</figcaption><img src="812x375.png"></figure><figure><figcaption>932x320</figcaption><img src="932x320.png"></figure><figure><figcaption>844x390-asymmetric</figcaption><img src="844x390-asymmetric.png"></figure>
